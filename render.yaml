services:
  # 1. FastAPI Decision Engine
  - type: web
    name: agrosense-engine
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r services/engine/requirements.txt
    startCommand: python -m uvicorn services.engine.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000

  # 2. Express Node.js API Gateway
  - type: web
    name: agrosense-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd apps/api && npm install && npm run build
    startCommand: cd apps/api && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: ENGINE_URL
        fromService:
          type: web
          name: agrosense-engine
          property: host

  # 3. React Vite Web Frontend
  - type: web
    name: agrosense-web
    env: static
    region: oregon
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
